apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodeployhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autodeployhub
  template:
    metadata:
      Labels:
        app: autodeployhub
  spec:
    containers:
      - name: flask-app
        image: REPLACE_IMAGE
        ports:
        - containerPort:5000
